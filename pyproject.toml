[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diffusion-image-deblending"
version = "0.1.0"
description = "Training-free two-source image deblending with diffusion priors"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9,<3.12"
authors = [
  {name = "Dan Botchan"},
  {name = "Ohad Fried"},
  {name = "Yacov Hel-Or"},
]
dependencies = [
  "albumentations==1.4.23",
  "blobfile==2.0.2",
  "einops==0.7.0",
  "gputil==1.4.0",
  "hydra-core==1.3.2",
  "kornia==0.7.0",
  "lpips==0.1.4",
  "matplotlib==3.7.4",
  "numpy==1.26.4",
  "omegaconf==2.3.0",
  "opencv-python-headless==4.10.0.84",
  "pandas==2.1.4",
  "Pillow==9.2.0",
  "pytorch-lightning==1.6.5.post0",
  "PyYAML==6.0",
  "scikit-image==0.22.0",
  "scipy==1.11.4",
  "setuptools<82",  # Lightning 1.6 imports pkg_resources at runtime.
  "taming-transformers-rom1504==0.0.6",
  "torch==2.5.1",
  "torchmetrics==0.11.4",
  "torchvision==0.20.1",
  "tqdm==4.67.1",
  "transformers==4.47.1",
  "clip @ git+https://github.com/openai/CLIP.git@d05afc436d78f1c48dc0dbf8e5980a9d471f35f6",
]

[project.optional-dependencies]
test = ["pytest==8.3.5"]
auto-prompts = ["accelerate==0.27.0"]

[tool.setuptools.packages.find]
where = ["."]
include = [
  "alphas*", "conditions*", "core*", "data*", "helpers*", "models*",
  "operators*", "paper_eval*", "paper_repro*", "samplers*", "utils*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
